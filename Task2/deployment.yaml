apiVersion: apps/v1
kind: Deployment
metadata:
  name: insuretech-test-app
  labels:
    app: insuretech-test-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: insuretech-test-app
  template:
    metadata:
      labels:
        app: insuretech-test-app
    spec:
      containers:
        - name: app
          image: ghcr.io/yandex-practicum/scaletestapp:latest
          ports:
            - containerPort: 8080
          resources:
            # HPA считает утилизацию памяти от requests, поэтому requests обязателен
            requests:
              memory: "30Mi"
              cpu: "50m"
            limits:
              memory: "30Mi"
